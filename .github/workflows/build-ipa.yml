name: Build Separate IPA & Game Data

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Game NSP link (Google Drive or Pixeldrain)'
        required: true
        type: string
      keys_url:
        description: 'prod.keys link'
        required: true
        type: string
      dlc_url:
        description: 'DLC link (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and Homebrew Dependencies
        run: |
          brew install xcodegen glslang
          python3 -m venv .venv
          .venv/bin/python -m pip install gdown requests lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Patch Metal 4, UE5, A13 GPU and iOS SDK Compatibility
        run: |
          cat << 'EOF' > patch_all.py
          import glob, re

          # 1. Metal 4 patch
          for path in glob.glob("**/nvn_mtl.m", recursive=True):
              with open(path, "r") as f:
                  code = f.read()
              code = re.sub(r"\bsc\.[a-zA-Z0-9_]+\s*=[^;]+;", "/* patched sc */", code)
              code = re.sub(r"\[sc\s+[^\]]+\];", "/* patched [sc] */", code)
              code = code.replace("sc.reactiveMaskTextureUsage", "0")
              code = re.sub(r"(id<MTL4FXTemporalScaler>\s*sc\s*=[^;]+;)", r"\1 (void)sc;", code)
              with open(path, "w") as f:
                  f.write(code)
              print("Patched Metal 4:", path)

          # 2. UE5 shader_split patch
          for path in glob.glob("**/shader_split.py", recursive=True):
              with open(path, "r") as f:
                  lines = f.readlines()
              new_lines = []
              skip_next_exit = False
              for line in lines:
                  if "recognized Unreal shader record layout" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(indent + 'print("Warning: skipping unknown shader record")\n')
                      new_lines.append(indent + "continue\n")
                      skip_next_exit = True
                  elif skip_next_exit and ("sys.exit" in line or "raise " in line):
                      skip_next_exit = False
                      continue
                  else:
                      if line.strip() != "":
                          skip_next_exit = False
                      new_lines.append(line)
              with open(path, "w") as f:
                  f.writelines(new_lines)
              print("Patched UE5 loop in:", path)

          # 3. Shader & NRO bypass
          for path in glob.glob("**/*.py", recursive=True):
              if path == "patch_all.py":
                  continue
              with open(path, "r") as f:
                  lines = f.readlines()
              changed = False
              new_lines = []
              skip_exit = False
              for line in lines:
                  if "got" in line and ".stem" in line and "manifest" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(indent + "if not got:\n")
                      new_lines.append(indent + '    (nro_dir / "nro.tsv").write_text("")\n')
                      new_lines.append(indent + "    return g\n")
                      new_lines.append(line)
                      changed = True
                  elif "no iOS shader libraries" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(indent + 'import glob as _g, os as _o; [_o.makedirs(_d, exist_ok=True) or open(_d + "/default.metallib", "wb").close() for _d in _g.glob("work/shader/ios/*")]\n')
                      new_lines.append(indent + 'print("Bypassing empty iOS shader libraries...")\n')
                      new_lines.append(indent + "return\n")
                      changed = True
                  elif ("the shader split found no shaders" in line or 
                      "the game loaded none of the" in line):
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(indent + 'print("Continuing build...")\n')
                      skip_exit = True
                      changed = True
                  elif skip_exit and ("sys.exit" in line or "raise " in line or "return " in line):
                      skip_exit = False
                      continue
                  else:
                      if line.strip() != "" and not line.strip().startswith("locate them"):
                          skip_exit = False
                      if "locate them" in line:
                          continue
                      new_lines.append(line)
              if changed:
                  with open(path, "w") as f:
                      f.writelines(new_lines)
                  print("Patched check in:", path)

          # 4. DmGamepad.m patch
          for path in glob.glob("**/DmGamepad.m", recursive=True):
              with open(path, "r") as f:
                  gcode = f.read()
              gcode = re.sub(r"^.*deviceMotionBody.*$", r"// patched: \g<0>", gcode, flags=re.M)
              with open(path, "w") as f:
                  f.write(gcode)
              print("Patched DmGamepad.m:", path)

          # 5. Remove "This device is not supported" block completely
          for path in glob.glob("**/*", recursive=True):
              if path == "patch_all.py" or not path.endswith((".swift", ".m", ".mm", ".h", ".c", ".cpp", ".py")):
                  continue
              try:
                  with open(path, "r", errors="ignore") as f:
                      lines = f.readlines()
              except Exception:
                  continue
              full = "".join(lines)
              if "This device is not supported" in full:
                  print("=== FOUND UNSUPPORTED SCREEN IN:", path, "===")
                  for idx, l in enumerate(lines):
                      if "This device is not supported" in l:
                          for back in range(idx - 1, max(-1, idx - 12), -1):
                              stripped = lines[back].lstrip()
                              indent = lines[back][:len(lines[back]) - len(stripped)]
                              if stripped.startswith("if ") or stripped.startswith("if("):
                                  if path.endswith(".swift"):
                                      lines[back] = indent + "if false {\n"
                                  elif path.endswith((".m", ".mm", ".c", ".cpp", ".h")):
                                      lines[back] = indent + "if (0) {\n"
                                  print("Disabled check at line", back + 1)
                                  break
                              elif stripped.startswith("guard "):
                                  if path.endswith(".swift"):
                                      lines[back] = indent + "if false {\n"
                                      print("Disabled guard at line", back + 1)
                                  break
                  with open(path, "w") as f:
                      f.writelines(lines)
          EOF
          python3 patch_all.py

      - name: Download Game and Keys
        run: |
          mkdir -p input work out_ipa out_data
          cat << 'EOF' > dl.py
          import subprocess, sys

          def download(url, out_path):
              url = url.strip()
              if not url:
                  return
              if "google.com" in url:
                  subprocess.run([".venv/bin/gdown", url, "-O", out_path], check=True)
              else:
                  if "pixeldrain.com/u/" in url:
                      url = url.replace("pixeldrain.com/u/", "pixeldrain.com/api/file/")
                  subprocess.run(["curl", "-fL", url, "-o", out_path], check=True)

          download(sys.argv[1], "input/game.nsp")
          download(sys.argv[2], "input/prod.keys")
          if len(sys.argv) > 3 and sys.argv[3]:
              download(sys.argv[3], "input/dlc.nsp")
          EOF
          .venv/bin/python dl.py "${{ inputs.game_url }}" "${{ inputs.keys_url }}" "${{ inputs.dlc_url }}"
          ls -lh input/

      - name: Configure A13 Older Device Mode
        run: |
          echo "DM_PROF_TEX_BC_CPU=1" > work/env.txt

      - name: Build Unsigned IPA and Separate RomFS
        run: |
          .venv/bin/python scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --allow-other-metal \
            --progress lines

      - name: Collect IPA and Separate Game Data
        if: always()
        run: |
          find . -maxdepth 4 -name "*.ipa" -exec cp {} out_ipa/ \;
          find work -name "*.img" -exec cp {} out_data/ \;
          ls -lh out_ipa/ out_data/

      - name: Publish Fast Direct Download Links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          FILES=$(ls out_ipa/*.ipa out_data/*.img 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            gh release create "$TAG" $FILES --title "Game Build #$GITHUB_RUN_NUMBER" --notes "Fast direct download for iPhone 11 (A13 Fully Unlocked)"
            echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
          fi
