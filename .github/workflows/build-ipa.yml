name: Build Separate IPA & Game Data (Final Complete Build)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'ลิงก์ Google Drive ของไฟล์เกม .nsp (เปิดทุกคนที่มีลิงก์)'
        required: true
        type: string
      keys_url:
        description: 'ลิงก์ของไฟล์ prod.keys'
        required: true
        type: string
      dlc_url:
        description: 'ลิงก์ของไฟล์ DLC (ถ้าไม่มีให้เว้นว่างไว้)'
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Homebrew Dependencies
        run: |
          brew install xcodegen glslang
          python3 -m venv .venv
          .venv/bin/python -m pip install gdown lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Patch Metal 4 & UE5 Shader Compatibility
        run: |
          python3 -c '
          import glob, re

          # 1. แพตช์ Metal 4 ใน nvn_mtl.m
          for path in glob.glob("**/nvn_mtl.m", recursive=True):
              with open(path, "r") as f:
                  code = f.read()
              code = re.sub(r"\bsc\.[a-zA-Z0-9_]+\s*=[^;]+;", "/* patched sc */", code)
              code = re.sub(r"\[sc\s+[^\]]+\];", "/* patched [sc] */", code)
              code = code.replace("sc.reactiveMaskTextureUsage", "0")
              code = re.sub(r"(id<MTL4FXTemporalScaler>\s*sc\s*=[^;]+;)", r"\1 (void)sc;", code)
              with open(path, "w") as f:
                  f.write(code)
              print("Patched Metal 4:", path)

          # 2. แก้ shader_split.py ให้ข้ามเฉพาะ record ที่ไม่รู้จัก (continue)
          for path in glob.glob("**/shader_split.py", recursive=True):
              with open(path, "r") as f:
                  lines = f.readlines()
              new_lines = []
              skip_next_exit = False
              for line in lines:
                  if "recognized Unreal shader record layout" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(indent + "print(\"Warning: skipping unknown shader record\")\n")
                      new_lines.append(indent + "continue\n")
                      skip_next_exit = True
                  elif skip_next_exit and ("sys.exit" in line or "raise " in line):
                      skip_next_exit = False
                      continue
                  else:
                      if line.strip() != "":
                          skip_next_exit = False
                      new_lines.append(line)
              with open(path, "w") as f:
                  f.writelines(new_lines)
              print("Patched UE5 loop in:", path)

          # 3. แก้ build_ipa_from_nsp.py ไม่ให้หยุดทำงานเมื่อ found no shaders
          for path in glob.glob("**/build_ipa_from_nsp.py", recursive=True):
              with open(path, "r") as f:
                  lines = f.readlines()
              new_lines = []
              skip_exit = False
              for line in lines:
                  if "the shader split found no shaders" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(indent + "print(\"Continuing without pre-split UE5 shaders...\")\n")
                      skip_exit = True
                  elif skip_exit and ("sys.exit" in line or "raise " in line or "return " in line):
                      skip_exit = False
                      continue
                  else:
                      if line.strip() != "" and not line.strip().startswith("locate them"):
                          skip_exit = False
                      if "locate them" in line:
                          continue
                      new_lines.append(line)
              with open(path, "w") as f:
                  f.writelines(new_lines)
              print("Patched build_ipa_from_nsp.py:", path)
          '

      - name: Download Game & Keys from Google Drive
        run: |
          mkdir -p input work out_ipa out_data
          if [[ "${{ inputs.game_url }}" == *"google.com"* ]]; then
            .venv/bin/gdown "${{ inputs.game_url }}" -O input/game.nsp
          else
            curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          fi
          
          if [[ "${{ inputs.keys_url }}" == *"google.com"* ]]; then
            .venv/bin/gdown "${{ inputs.keys_url }}" -O input/prod.keys
          else
            curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          fi

          if [ -n "${{ inputs.dlc_url }}" ]; then
            if [[ "${{ inputs.dlc_url }}" == *"google.com"* ]]; then
              .venv/bin/gdown "${{ inputs.dlc_url }}" -O input/dlc.nsp
            else
              curl -fL "${{ inputs.dlc_url }}" -o input/dlc.nsp
            fi
          fi
          ls -lh input/

      - name: Configure A13 Older Device Mode
        run: |
          echo "DM_PROF_TEX_BC_CPU=1" > work/env.txt

      - name: Build Unsigned IPA & Separate RomFS
        run: |
          .venv/bin/python scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --allow-other-metal \
            --progress lines

      - name: Collect IPA and Separate Game Data
        if: always()
        run: |
          find . -maxdepth 4 -name "*.ipa" -exec cp {} out_ipa/ \;
          find work -name "*.img" -exec cp {} out_data/ \;
          ls -lh out_ipa/ out_data/

      - name: Upload 1 - Game App (.ipa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1-Unsigned-IPA
          path: out_ipa/*.ipa
          if-no-files-found: warn

      - name: Upload 2 - Game Data (RomFS.img)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2-Game-Data-RomFS
          path: out_data/*.img
          if-no-files-found: warn
