name: Build unsigned IPA (A13 + Separate Data)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct Link ของไฟล์เกม (.nsp, .xci, .nsz)'
        required: true
        type: string
      keys_url:
        description: 'Direct Link ของไฟล์ prod.keys'
        required: true
        type: string
      dlc_url:
        description: 'Direct Link ของไฟล์ DLC (ถ้าไม่มีให้เว้นว่างไว้)'
        required: false
        type: string
      a13_older_device:
        description: 'เปิดโหมดชิป A13 / A15 ลงไป (iPhone 11 Pro Max)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Homebrew Dependencies
        run: |
          brew bundle --file=Brewfile
          python3 -m venv .venv
          .venv/bin/python -m pip install lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Download game and keys
        run: |
          mkdir -p input work out_ipa out_data
          curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          if [ -n "${{ inputs.dlc_url }}" ]; then
            curl -fL "${{ inputs.dlc_url }}" -o input/dlc.nsp
          fi
          ls -lh input/

      - name: Configure A13 Older Device Mode
        run: |
          touch work/env.txt
          if [ "${{ inputs.a13_older_device }}" == "true" ]; then
            echo "DM_PROF_TEX_BC_CPU=1" >> work/env.txt
          fi

      - name: Build unsigned IPA
        run: |
          .venv/bin/python scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --allow-other-metal \
            --progress lines

      - name: Collect IPA and Separate Game Data
        run: |
          find . -maxdepth 4 -name "*.ipa" -exec cp {} out_ipa/ \;
          find work -name "*.img" -exec cp {} out_data/ \;
          ls -lh out_ipa/ out_data/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 1-Unsigned-IPA
          path: out_ipa/*.ipa
          if-no-files-found: error

      - name: Upload Separate Game Data
        uses: actions/upload-artifact@v4
        with:
          name: 2-Game-Data-RomFS
          path: out_data/*.img
          if-no-files-found: error
