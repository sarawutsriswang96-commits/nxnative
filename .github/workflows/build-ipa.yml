name: Instant Ubuntu Build (No Queue + Pixeldrain)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'ลิงก์ Google Drive ของไฟล์เกม .nsp (เปิดทุกคนที่มีลิงก์)'
        required: true
        type: string
      keys_url:
        description: 'ลิงก์ของไฟล์ prod.keys'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install gdown lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Download Game & Keys
        run: |
          mkdir -p input work out_data
          .venv/bin/gdown "${{ inputs.game_url }}" -O input/game.nsp || curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          .venv/bin/gdown "${{ inputs.keys_url }}" -O input/prod.keys || curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          echo "DM_PROF_TEX_BC_CPU=1" > work/env.txt

      - name: Extract Game Data & Prepare A13 Package
        run: |
          mkdir -p ~/.switch work/extracted
          cp input/prod.keys ~/.switch/prod.keys
          .venv/bin/nsz -x -o work/extracted input/game.nsp
          cp work/env.txt work/extracted/

      - name: Upload Fast Link (Pixeldrain)
        run: |
          cp -r work/extracted/* out_data/
          zip -r -0 Game-Data-A13-Ready.zip out_data/
          echo "=== ลิงก์โหลดไฟล์ (เติม https://pixeldrain.com ด้านหน้า id) ==="
          curl -T Game-Data-A13-Ready.zip https://pixeldrain.com
          echo ""
