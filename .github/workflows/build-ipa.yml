name: Instant Ubuntu Build (No Queue + Linux Extractor)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'ลิงก์ Google Drive ของไฟล์เกม .nsp (ต้องเปิดทุกคนที่มีลิงก์)'
        required: true
        type: string
      keys_url:
        description: 'ลิงก์ของไฟล์ prod.keys'
        required: true
        type: string
      dlc_url:
        description: 'ลิงก์ของไฟล์ DLC (ถ้าไม่มีให้เว้นว่างไว้)'
        required: false
        type: string
      a13_older_device:
        description: 'เปิดโหมดชิป A13 / A15 ลงไป (iPhone 11 Pro Max)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Build Linux Extractor (nstool)
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential git cmake
          python3 -m venv .venv
          .venv/bin/python -m pip install gdown lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"
          git clone --depth 1 https://github.com /tmp/nstool
          make -C /tmp/nstool -j$(nproc)
          sudo cp /tmp/nstool/bin/nstool /usr/local/bin/
          nstool --version

      - name: Download Game & Keys from Google Drive
        run: |
          mkdir -p input work out_data
          if [[ "${{ inputs.game_url }}" == *"google.com"* ]]; then
            .venv/bin/gdown "${{ inputs.game_url }}" -O input/game.nsp
          else
            curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          fi
          
          if [[ "${{ inputs.keys_url }}" == *"google.com"* ]]; then
            .venv/bin/gdown "${{ inputs.keys_url }}" -O input/prod.keys
          else
            curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          fi

          if [ -n "${{ inputs.dlc_url }}" ]; then
            if [[ "${{ inputs.dlc_url }}" == *"google.com"* ]]; then
              .venv/bin/gdown "${{ inputs.dlc_url }}" -O input/dlc.nsp
            else
              curl -fL "${{ inputs.dlc_url }}" -o input/dlc.nsp
            fi
          fi
          ls -lh input/

      - name: Configure A13 Older Device Mode
        run: |
          touch work/env.txt
          if [ "${{ inputs.a13_older_device }}" == "true" ]; then
            echo "DM_PROF_TEX_BC_CPU=1" >> work/env.txt
          fi

      - name: Extract & Convert Game Data (A13 Ready)
        run: |
          mkdir -p work/extracted work/romfs_dir
          nstool -k input/prod.keys -x work/extracted input/game.nsp
          find work/extracted -type f -name "*.nca" -exec ls -lh {} \;
          MAIN_NCA=$(find work/extracted -type f -name "*.nca" -printf "%s %p\n" | sort -rn | head -n 1 | cut -d' ' -f2-)
          echo "Extracting largest NCA: $MAIN_NCA"
          nstool -k input/prod.keys --romfsdir work/romfs_dir --exefsdir work/exefs_dir "$MAIN_NCA"
          cp work/env.txt work/romfs_dir/ 2>/dev/null || true
          ls -lh work/exefs_dir/ work/romfs_dir/

      - name: Package Separate Game Data
        run: |
          mkdir -p out_data
          cp -r work/exefs_dir out_data/
          cp work/env.txt out_data/
          tar -cf out_data/RomFS.img -C work/romfs_dir .
          ls -lh out_data/

      - name: Upload Separate Game Data
        uses: actions/upload-artifact@v4
        with:
          name: Game-Data-A13-Ready
          path: out_data/
          if-no-files-found: error
