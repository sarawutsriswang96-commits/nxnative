name: Build Separate IPA & Game Data (A13 + Metal4 Fix)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'ลิงก์ Google Drive ของไฟล์เกม .nsp (เปิดทุกคนที่มีลิงก์)'
        required: true
        type: string
      keys_url:
        description: 'ลิงก์ของไฟล์ prod.keys'
        required: true
        type: string
      dlc_url:
        description: 'ลิงก์ของไฟล์ DLC (ถ้าไม่มีให้เว้นว่างไว้)'
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Homebrew Dependencies
        run: |
          brew install xcodegen glslang
          python3 -m venv .venv
          .venv/bin/python -m pip install gdown lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Patch Metal 4 Compatibility in nvn_mtl.m
        run: |
          python3 -c '
          import glob, re
          for path in glob.glob("**/nvn_mtl.m", recursive=True):
              with open(path, "r") as f:
                  code = f.read()
              # ปิดคำสั่ง sc.* ทั้งหมด (รวมถึงคำสั่งที่ขึ้นบรรทัดใหม่) และ [sc ...]
              code = re.sub(r"\bsc\.[a-zA-Z0-9_]+\s*=[^;]+;", "/* patched sc */", code)
              code = re.sub(r"\[sc\s+[^\]]+\];", "/* patched [sc] */", code)
              code = re.sub(r"(id<MTL4FXTemporalScaler>\s*sc\s*=[^;]+;)", r"\1 (void)sc;", code)
              with open(path, "w") as f:
                  f.write(code)
              print("Patched successfully:", path)
          '

      - name: Download Game & Keys from Google Drive
        run: |
          mkdir -p input work out_ipa out_data
          if [[ "${{ inputs.game_url }}" == *"google.com"* ]]; then
            .venv/bin/gdown "${{ inputs.game_url }}" -O input/game.nsp
          else
            curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          fi
          
          if [[ "${{ inputs.keys_url }}" == *"google.com"* ]]; then
            .venv/bin/gdown "${{ inputs.keys_url }}" -O input/prod.keys
          else
            curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          fi

          if [ -n "${{ inputs.dlc_url }}" ]; then
            if [[ "${{ inputs.dlc_url }}" == *"google.com"* ]]; then
              .venv/bin/gdown "${{ inputs.dlc_url }}" -O input/dlc.nsp
            else
              curl -fL "${{ inputs.dlc_url }}" -o input/dlc.nsp
            fi
          fi
          ls -lh input/

      - name: Configure A13 Older Device Mode
        run: |
          echo "DM_PROF_TEX_BC_CPU=1" > work/env.txt

      - name: Build Unsigned IPA & Separate RomFS
        run: |
          .venv/bin/python scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --allow-other-metal \
            --progress lines || (grep -B 2 -A 5 "error:" work/logs/mac_host_build.log && exit 1)

      - name: Collect IPA and Separate Game Data
        if: always()
        run: |
          find . -maxdepth 4 -name "*.ipa" -exec cp {} out_ipa/ \;
          find work -name "*.img" -exec cp {} out_data/ \;
          ls -lh out_ipa/ out_data/

      - name: Upload 1 - Game App (.ipa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1-Unsigned-IPA
          path: out_ipa/*.ipa
          if-no-files-found: warn

      - name: Upload 2 - Game Data (RomFS.img)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2-Game-Data-RomFS
          path: out_data/*.img
          if-no-files-found: warn
