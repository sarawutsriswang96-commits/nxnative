name: Build unsigned IPA (A13 + Separate Data)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct Link ของไฟล์เกมหลัก (.nsp, .xci, .nsz)'
        required: true
        type: string
      keys_url:
        description: 'Direct Link ของไฟล์ prod.keys'
        required: true
        type: string
      extra_urls:
        description: 'Direct Link ของไฟล์ Update / DLC (ถ้ามีหลายไฟล์ให้คั่นด้วยเว้นวรรค)'
        required: false
        default: ''
        type: string
      a13_older_device:
        description: 'เปิดโหมดชิป A13 / A15 ลงไป (iPhone 11 Pro Max)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xcode Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Set up Python & Homebrew Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install xcodegen zstd glslang
          python3 -m venv .venv
          .venv/bin/python -m pip install lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Download game and keys
        env:
          GAME_URL: ${{ inputs.game_url }}
          KEYS_URL: ${{ inputs.keys_url }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
        run: |
          mkdir -p input work out_ipa out_data
          ext="nsp"
          case "$GAME_URL" in
            *.xci*) ext="xci" ;;
            *.nsz*) ext="nsz" ;;
          esac
          curl -fL --retry 3 "$GAME_URL" -o "input/game.${ext}"
          curl -fL --retry 3 "$KEYS_URL" -o input/prod.keys
          i=1
          for url in $EXTRA_URLS; do
            e_ext="nsp"
            case "$url" in
              *.xci*) e_ext="xci" ;;
              *.nsz*) e_ext="nsz" ;;
            esac
            curl -fL --retry 3 "$url" -o "input/extra_${i}.${e_ext}"
            i=$((i + 1))
          done
          ls -lh input/

      - name: Configure A13 Older Device Mode
        env:
          IS_A13: ${{ inputs.a13_older_device }}
        run: |
          touch work/env.txt
          if [ "$IS_A13" = "true" ]; then
            echo "DM_PROF_TEX_BC_CPU=1" >> work/env.txt
          fi

      - name: Build unsigned IPA
        run: |
          .venv/bin/python scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            -o out_ipa/game.ipa \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --allow-other-metal \
            --progress lines

      - name: Collect Separate Game Data
        run: |
          find work -name "*.img" -exec cp {} out_data/ \;
          ls -lh out_ipa/ out_data/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 1-Unsigned-IPA
          path: out_ipa/*.ipa
          if-no-files-found: error

      - name: Upload Separate Game Data
        uses: actions/upload-artifact@v4
        with:
          name: 2-Game-Data-RomFS
          path: out_data/*.img
          if-no-files-found: error
