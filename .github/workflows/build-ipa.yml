name: Build Game IPA & Data (One-Click)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'ลิงก์ Google Drive ของไฟล์เกม .nsp (เปิดทุกคนที่มีลิงก์)'
        required: true
        type: string
      keys_url:
        description: 'ลิงก์ของไฟล์ prod.keys'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew bundle --file=Brewfile
          python3 -m venv .venv
          .venv/bin/python -m pip install gdown lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Download Files
        run: |
          mkdir -p input work out
          .venv/bin/gdown "${{ inputs.game_url }}" -O input/game.nsp || curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          .venv/bin/gdown "${{ inputs.keys_url }}" -O input/prod.keys || curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          echo "DM_PROF_TEX_BC_CPU=1" > work/env.txt

      - name: Build IPA & Separate Data
        run: |
          .venv/bin/python scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --allow-other-metal \
            --progress lines

      - name: Upload Fast Links (Pixeldrain)
        run: |
          find . -maxdepth 4 -name "*.ipa" -exec cp {} out/game.ipa \;
          find work -name "*.img" -exec cp {} out/RomFS.img \;
          echo "=== ลิงก์โหลดตัวแอป .IPA (เติม https://pixeldrain.com ด้านหน้า id) ==="
          curl -T out/game.ipa https://pixeldrain.com
          echo ""
          echo "=== ลิงก์โหลดไฟล์ Data เกม (เติม https://pixeldrain.com ด้านหน้า id) ==="
          curl -T out/RomFS.img https://pixeldrain.com
          echo ""
