name: Fast Convert Game Data (Ubuntu - Instant Start)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct Link ของไฟล์เกม (.nsp, .xci, .nsz)'
        required: true
        type: string
      keys_url:
        description: 'Direct Link ของไฟล์ prod.keys'
        required: true
        type: string
      dlc_url:
        description: 'Direct Link ของไฟล์ DLC (ถ้าไม่มีให้เว้นว่างไว้)'
        required: false
        type: string
      a13_older_device:
        description: 'เปิดโหมดชิป A13 / A15 ลงไป (iPhone 11 Pro Max)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Download game and keys
        run: |
          mkdir -p input work out_data
          curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          if [ -n "${{ inputs.dlc_url }}" ]; then
            curl -fL "${{ inputs.dlc_url }}" -o input/dlc.nsp
          fi
          ls -lh input/

      - name: Configure A13 Older Device Mode
        run: |
          touch work/env.txt
          if [ "${{ inputs.a13_older_device }}" == "true" ]; then
            echo "DM_PROF_TEX_BC_CPU=1" >> work/env.txt
          fi

      - name: Convert Game Data (Separate RomFS + A13 Patch)
        run: |
          .venv/bin/python scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --prepare-xcode \
            --progress lines

      - name: Collect Game Data
        run: |
          find work -maxdepth 4 -ls
          find work -name "*.img" -exec cp {} out_data/ \;
          cp work/env.txt out_data/ 2>/dev/null || true
          ls -lh out_data/

      - name: Upload Separate Game Data
        uses: actions/upload-artifact@v4
        with:
          name: Game-Data-A13-Ready
          path: out_data/
          if-no-files-found: error
