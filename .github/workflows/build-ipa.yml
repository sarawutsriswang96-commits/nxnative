name: Instant Ubuntu Build (No Queue + Built-in Extractor)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'ลิงก์ Google Drive ของไฟล์เกม .nsp (ต้องเปิดทุกคนที่มีลิงก์)'
        required: true
        type: string
      keys_url:
        description: 'ลิงก์ของไฟล์ prod.keys'
        required: true
        type: string
      dlc_url:
        description: 'ลิงก์ของไฟล์ DLC (ถ้าไม่มีให้เว้นว่างไว้)'
        required: false
        type: string
      a13_older_device:
        description: 'เปิดโหมดชิป A13 / A15 ลงไป (iPhone 11 Pro Max)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install gdown lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Download Game & Keys from Google Drive
        run: |
          mkdir -p input work out_data
          if [[ "${{ inputs.game_url }}" == *"google.com"* ]]; then
            .venv/bin/gdown "${{ inputs.game_url }}" -O input/game.nsp
          else
            curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          fi
          
          if [[ "${{ inputs.keys_url }}" == *"google.com"* ]]; then
            .venv/bin/gdown "${{ inputs.keys_url }}" -O input/prod.keys
          else
            curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          fi

          if [ -n "${{ inputs.dlc_url }}" ]; then
            if [[ "${{ inputs.dlc_url }}" == *"google.com"* ]]; then
              .venv/bin/gdown "${{ inputs.dlc_url }}" -O input/dlc.nsp
            else
              curl -fL "${{ inputs.dlc_url }}" -o input/dlc.nsp
            fi
          fi
          ls -lh input/

      - name: Configure A13 Older Device Mode
        run: |
          touch work/env.txt
          if [ "${{ inputs.a13_older_device }}" == "true" ]; then
            echo "DM_PROF_TEX_BC_CPU=1" >> work/env.txt
          fi

      - name: Extract Game Data & Prepare A13 Package
        run: |
          mkdir -p ~/.switch work/extracted
          cp input/prod.keys ~/.switch/prod.keys
          .venv/bin/nsz -x -o work/extracted input/game.nsp
          cp work/env.txt work/extracted/
          ls -lh work/extracted/

      - name: Package Separate Game Data
        run: |
          mkdir -p out_data
          cp -r work/extracted/* out_data/
          ls -lh out_data/

      - name: Upload Separate Game Data
        uses: actions/upload-artifact@v4
        with:
          name: Game-Data-A13-Ready
          path: out_data/
          if-no-files-found: error
